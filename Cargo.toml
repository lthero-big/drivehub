[workspace]
resolver = "2"
members = ["server/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }
drivehub-core = { path = "server/crates/core" }
drivehub-storage = { path = "server/crates/storage" }
drivehub-search = { path = "server/crates/search" }
drivehub-webdav = { path = "server/crates/webdav" }

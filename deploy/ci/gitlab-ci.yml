# GitLab CI equivalent of .github/workflows/{ci,release}.yml for code.zuvi.com.
# Inactive template: copy to /.gitlab-ci.yml once a runner (docker executor, with
# docker:dind for the image job) is attached to the project.
# Artifacts stay on GitLab job pages; nothing is pushed to a registry.
stages: [check, test, build, package]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

version:
  stage: check
  image: node:22-bookworm-slim
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gawk >/dev/null
    - if [ -n "$CI_COMMIT_TAG" ]; then scripts/check-version.sh "$CI_COMMIT_TAG"; else scripts/check-version.sh; fi

test:
  stage: test
  image: rust:1-bookworm
  cache: { key: cargo, paths: [.cargo/registry, target] }
  script:
    - cargo test --workspace --locked

web:
  stage: build
  image: node:22-bookworm-slim
  script:
    - cd web && npm ci && npm run build
  artifacts: { paths: [web/dist], expire_in: 1 week }

release:server:
  stage: package
  image: rust:1-bookworm
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v/' }]
  needs: [version, test, web]
  cache: { key: cargo-release, paths: [.cargo/registry, target] }
  script:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null && apt-get install -y -qq nodejs >/dev/null
    - SKIP_WEB=1 OUT=out scripts/package-release.sh
    # aarch64: run the same job on an arm64 runner (tags: [arm64]) instead of cross-compiling.
  artifacts: { paths: [out/], expire_in: 90 days }

release:docker:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v/' }]
  needs: [version, test]
  script:
    - apk add --no-cache bash coreutils
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - BASE=drivehub-base:$(sha256sum deploy/base.Dockerfile | cut -c1-12)
    - docker build -f deploy/base.Dockerfile -t "$BASE" deploy
    - docker build -f deploy/runtime.Dockerfile --build-arg BASE_IMAGE="$BASE" --build-arg VERSION="$VERSION" -t drivehub:$VERSION -t drivehub:latest .
    - mkdir out && docker save drivehub:$VERSION drivehub:latest | gzip > out/drivehub-$VERSION-docker-amd64.tar.gz
    - cd out && sha256sum * > SHA256SUMS
    # Publishing intentionally disabled:
    # - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # - for t in $VERSION latest; do docker tag drivehub:$t $CI_REGISTRY_IMAGE:$t; docker push $CI_REGISTRY_IMAGE:$t; done
  artifacts: { paths: [out/], expire_in: 90 days }

release:android:
  stage: package
  image: eclipse-temurin:21-jdk
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v/' }]
  needs: [version]
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  cache: { key: android, paths: [.android-sdk, .gradle] }
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip curl >/dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p "$ANDROID_HOME/cmdline-tools" && unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
    - VERSION=$(tr -d '[:space:]' < VERSION)
    # CI/CD variables (masked/protected): ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KEYSTORE_PASSWORD,
    # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the release APK is signed with the CI debug
    # key: installable for testing, NOT suitable for stores / in-place updates.
    - |
      if [ -n "$ANDROID_KEYSTORE_B64" ]; then
        echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.jks
        export DRIVEHUB_KEYSTORE_FILE=/tmp/release.jks DRIVEHUB_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" DRIVEHUB_KEY_ALIAS="$ANDROID_KEY_ALIAS" DRIVEHUB_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
        SIGNING=release-key
      else
        SIGNING=debug-key
      fi
      cd android && ./gradlew --no-daemon testDebugUnitTest assembleRelease && cd ..
      mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk "out/drivehub-$VERSION-android-$SIGNING.apk"
      (cd out && sha256sum * > SHA256SUMS)
  artifacts: { paths: [out/], expire_in: 90 days }

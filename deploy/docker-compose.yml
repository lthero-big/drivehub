# DriveHub — docker compose deployment. See docs/deploy.md.
# The default tag is kept in sync with /VERSION by scripts/bump-version.sh;
# override with DRIVEHUB_TAG=latest (or another release) in .env.
services:
  drivehub:
    image: ${DRIVEHUB_IMAGE:-drivehub}:${DRIVEHUB_TAG:-0.1.0}
    ports: ["${DRIVEHUB_PORT:-8470}:8470"]
    volumes:
      - ./data:/data
      - ./config:/config
    restart: unless-stopped
  # Optional, enable with: docker compose --profile pg up
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: drivehub
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: drivehub
    volumes: ["./pg:/var/lib/postgresql/data"]

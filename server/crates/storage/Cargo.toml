[package]
name = "drivehub-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1.12.2"
futures = "0.3.34"
base64 = "0.22"
hmac = "0.12"
httpdate = "1"
md5 = { version = "0.10", package = "md-5" }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "stream"] }
serde_json.workspace = true
sha1 = "0.10"
num-bigint = "0.4"
opendal = { version = "0.59.5", features = ["services-fs", "services-s3", "services-webdav"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
p224 = { version = "0.13.2", features = ["ecdh"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
crc32fast = "1.5.5"
lz4_flex = "0.14.2"

[dev-dependencies]
axum.workspace = true
tempfile = "3.27.0"

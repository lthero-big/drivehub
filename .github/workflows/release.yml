# Release pipeline (DEPTAI-478): push a tag vX.Y.Z whose number equals /VERSION.
#   scripts/bump-version.sh X.Y.Z && git commit -am "release: vX.Y.Z" && git tag vX.Y.Z && git push --tags
# Builds and verifies server binary, web dist, bundle, Android APK, and Docker image.
# Tag builds publish assets + signed release-manifest.json to GitHub Releases and push
# Docker images to GHCR (and Docker Hub when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are set).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_docker:
        description: "Push Docker images for current VERSION to GHCR & Docker Hub"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: tag == VERSION == every consumer
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then scripts/check-version.sh "$GITHUB_REF_NAME"; else scripts/check-version.sh; fi
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist, retention-days: 7 }

  server:
    needs: [version, test, web]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          # aarch64: native ARM runner (no cross toolchain needed). Enable when wanted:
          # - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: package (binary + web + bundle + SHA256SUMS)
        run: SKIP_WEB=1 OUT=out scripts/package-release.sh
      - name: smoke — binary serves /api/version with the release number
        run: |
          DRIVEHUB_BIND=127.0.0.1:18478 DRIVEHUB_DATA_DIR=$RUNNER_TEMP/dh DRIVEHUB_WEB_DIR=web/dist ./out/drivehub-linux-${{ matrix.arch }} &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:18478/api/version && break; sleep 1; done | tee v.json
          grep -q "\"server_version\":\"${{ needs.version.outputs.version }}\"" v.json
          curl -fsS -o /dev/null http://127.0.0.1:18478/
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}
          path: out/*
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: wrapper }
      - name: unit tests (version negotiation, API client)
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: android
      - name: signing key from secrets (optional)
        # Secrets: ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
        # ANDROID_KEY_PASSWORD. When ANDROID_KEYSTORE_B64 is not configured the release APK is
        # signed with the CI debug key: installable for testing, NOT suitable for stores / updates.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DRIVEHUB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "DRIVEHUB_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "DRIVEHUB_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "DRIVEHUB_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi
      - name: assemble release APK (versionName/versionCode from VERSION)
        run: ./gradlew --no-daemon assembleRelease
        working-directory: android
      - name: collect APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/drivehub-$VERSION-android-$SIGNING.apk"
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/*, retention-days: 14 }

  docker:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: base image (tag = hash of base.Dockerfile)
        run: |
          BASE_TAG=$(sha256sum deploy/base.Dockerfile | cut -c1-12)
          echo "BASE=drivehub-base:$BASE_TAG" >> "$GITHUB_ENV"
          docker build -f deploy/base.Dockerfile -t drivehub-base:$BASE_TAG -t drivehub-base:latest deploy
      - name: runtime image FROM base (tags = version + latest)
        run: |
          docker build -f deploy/runtime.Dockerfile \
            --build-arg BASE_IMAGE="$BASE" --build-arg VERSION="$VERSION" \
            -t drivehub:$VERSION -t drivehub:latest .
      - name: smoke — container health + version
        run: |
          docker run -d --name dh -p 18470:8470 drivehub:$VERSION
          for i in $(seq 30); do curl -fsS http://127.0.0.1:18470/api/version && break; sleep 1; done | tee v.json
          grep -q "\"server_version\":\"$VERSION\"" v.json
          docker rm -f dh
      - name: publish to GHCR
        if: github.ref_type == 'tag' || inputs.publish_docker == true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_REPO: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=$(echo "$GHCR_REPO" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for t in "$VERSION" latest; do
            docker tag "drivehub:$t" "${IMAGE}:$t"
            docker push "${IMAGE}:$t"
          done
      - name: publish to Docker Hub (when secrets configured)
        if: github.ref_type == 'tag' || inputs.publish_docker == true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured; skipping Docker Hub push."
            exit 0
          fi
          IMAGE="$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/drivehub"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for t in "$VERSION" latest; do
            docker tag "drivehub:$t" "${IMAGE}:$t"
            docker push "${IMAGE}:$t"
          done

  checksums:
    needs: [version, server, docker, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: combined SHA256SUMS
        run: |
          mkdir release
          find artifacts -type f ! -name SHA256SUMS ! -path '*/web-dist/*' -exec cp {} release/ \;
          chmod +x release/drivehub-linux-*
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: release manifest (includes Android APK; signed only when the key secret is set)
        env:
          RELEASE_KEY: ${{ secrets.DRIVEHUB_RELEASE_KEY }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Never print the key. Write it to a temp file only if present.
          if [[ -n "$RELEASE_KEY" ]]; then
            KEY="$RUNNER_TEMP/drivehub-release.key"
            umask 077
            printf '%s' "$RELEASE_KEY" > "$KEY"
            export DRIVEHUB_RELEASE_KEY="$KEY"
          fi
          scripts/emit-release-manifest.sh --dir release --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/" \
            --docker "ghcr.io/lthero-big/drivehub:$VERSION"
          rm -f "$RUNNER_TEMP/drivehub-release.key"
          (cd release && rm -f SHA256SUMS && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: drivehub-${{ needs.version.outputs.version }}-release
          path: release/*
          retention-days: 30
      - name: publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "DriveHub $VERSION" \
              --generate-notes
          fi
